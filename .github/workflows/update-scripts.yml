name: Daily Script Auto-Update

# Runs the auto-update agent every day at 06:00 UTC, and on demand.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: script-bank-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run auto-update agent
        id: agent
        env:
          # Stored as a PRIVATE GitHub Actions secret — never visible in the repo,
          # the logs, or the published Pages site, even though the repo is public.
          # Add it in: Settings -> Secrets and variables -> Actions -> New repository secret.
          # Without it the agent runs in report-only mode (flags drift, no regeneration).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional: override the free models (comma-separated).
          BANK_MODELS: "minimax/minimax-m2.5:free,moonshotai/kimi-k2.6:free"
        run: |
          python agent/update_scripts.py || echo "agent_exit=$?" >> "$GITHUB_OUTPUT"

      - name: Commit changes
        id: commit
        run: |
          git config user.name  "script-bank-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "chore(agent): daily source check & script refresh [skip ci]"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # A push made with the workflow's own GITHUB_TOKEN does not trigger other
  # workflows (and the commit carries [skip ci]), so deploy the site from here
  # whenever the agent committed something.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
